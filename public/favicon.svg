<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22d3ee" stroke-width="6" stroke-opacity="0.25" />

  <!-- Target & Quantitative Graph Icon -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyan-grad)" stroke-width="12" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Trend Bars with glow -->
  <rect x="140" y="270" width="44" height="110" rx="10" fill="url(#cyan-grad)" />
  <rect x="206" y="210" width="44" height="170" rx="10" fill="url(#cyan-grad)" />
  <rect x="272" y="160" width="44" height="220" rx="10" fill="url(#purple-grad)" />
  <rect x="338" y="110" width="44" height="270" rx="10" fill="#10b981" />

  <!-- Trend Line Over Bars -->
  <path d="M 162 250 L 228 190 L 294 140 L 360 90" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="360" cy="90" r="14" fill="#10b981" stroke="#ffffff" stroke-width="4" />
</svg>
